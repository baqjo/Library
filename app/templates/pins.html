{% extends "base.html" %}
{% block content %}
<h2>{{ t('pins') }}</h2>
<p>{{ t('pins_hint') }}</p>
<form method="post" class="card row">
  <label>{{ t('section') }}<select name="section_id"><option value="">{{ t('all') }}</option>{% for s in sections %}<option value="{{ s.id }}">{{ s.label(lang) }}</option>{% endfor %}</select></label>
  <label class="check"><input type="checkbox" name="regenerate" value="1"> {{ t('regenerate_existing') }}</label>
  <button class="btn">{{ t('generate') }}</button>
</form>
<p><small>{{ t('portal_link') }}: <span dir="ltr">{{ url_for('portal.login', _external=True) }}</span></small></p>
{% endblock %}
