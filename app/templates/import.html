{% extends "base.html" %}
{% block content %}
<h2>{{ t('import') }} — {{ year.name if year else '' }}</h2>
<form method="post" enctype="multipart/form-data" class="card narrow">
  <p>{{ t('template_hint') }}</p>
  <p><a href="{{ url_for('main.import_template') }}">{{ t('download_template') }}</a></p>
  <label>{{ t('upload_file') }}<input type="file" name="file" accept=".csv,.xlsx" required></label>
  <label class="check"><input type="checkbox" name="auto" value="1" checked> {{ t('auto_create') }}</label>
  <button class="btn">{{ t('preview') }}</button>
</form>
{% endblock %}
