{% extends "base.html" %}
{% block content %}
<h2>{{ t('users') }}</h2>
<form method="post" class="card row">
  <label>{{ t('username') }}<input name="username" required dir="ltr" autocomplete="off"></label>
  <label>{{ t('password') }}<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
  <label>{{ t('role') }}<select name="role"><option value="librarian">{{ t('role_librarian') }}</option><option value="admin">{{ t('role_admin') }}</option></select></label>
  <button class="btn">{{ t('add') }}</button>
</form>
<div class="card tablewrap"><table>
<tr><th>{{ t('username') }}</th><th>{{ t('role') }}</th><th>{{ t('actions') }}</th></tr>
{% for u in users %}
<tr><td dir="ltr">{{ u.username }}</td><td>{{ t('role_admin') if u.role=='admin' else t('role_librarian') }}</td>
<td>
 <form method="post" action="{{ url_for('main.user_password', uid=u.id) }}" class="inline"><input name="password" type="password" minlength="8" placeholder="{{ t('new_password') }}" required autocomplete="new-password"> <button class="btn sm">{{ t('save') }}</button></form>
 {% if u.id != current_user.id %}<form method="post" action="{{ url_for('main.user_delete', uid=u.id) }}" class="inline" onsubmit="return confirm('{{ t('confirm_delete') }}')"><button class="btn sm danger">{{ t('delete') }}</button></form>{% endif %}
</td></tr>{% endfor %}
</table></div>
{% endblock %}
